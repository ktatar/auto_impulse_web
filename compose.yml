services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -lc "rm -f .astro/dev.json && exec npm run dev -- --host 0.0.0.0 --port 4321"

volumes:
  node_modules:
